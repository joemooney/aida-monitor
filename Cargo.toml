[package]
name = "aida-monitor"
version = "0.1.0"
authors = ["Joe Mooney <joe.mooney@gmail.com>"]
edition = "2021"
description = "Read-only operator dashboard for AIDA-managed software projects"

[dependencies]
dioxus = { version = "0.6.3", features = ["router"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.45", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.2"
regex = "1.11"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
