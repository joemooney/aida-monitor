title: Identify active agent processes on held PRs at the gate
description: |-
  ## Problem
  When a pull request is held at the gate (`aida merge-hold list`), an operator cannot immediately tell whether an autonomous reviewer process is actively reviewing it or has halted. Merging without this knowledge risks merging seconds before a reviewer's objection is posted.

  ## Proposed Solution
  Correlate `aida merge-hold list --json` with `aida ps --json` and `aida review verdict <SPEC> --format json` (plus `aida findings list --json`) to display reviewer process state, finding summaries, and recorded verdicts without reading internal store directories directly.

  ## Acceptance Criteria
  - [ ] At The Gate panel correlates held PR spec/branch with active sessions in `aida ps --json`.
  - [ ] Shows live status: Reviewer Active (PID, elapsed duration) vs Idle / Awaiting Operator.
  - [ ] Displays finding summaries via `aida findings list --json` rather than direct filesystem reads.
  - [ ] Displays recorded review verdicts via `aida review verdict <SPEC> --format json`.
  - [ ] Complies with Prime Directives 2 & 3: CLI JSON consumption only, no direct internal file reads.
  - [ ] Self-check verifies PID and held count against raw CLI JSON.
