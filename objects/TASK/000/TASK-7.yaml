  content: |-
    ## Acceptance Criteria
    - Top-level executable script `run.sh` (executable permissions `chmod +x run.sh`).
    - Resolves repository root directory so running from any subdirectory works.
    - Passes all arguments transparently to `cargo run -- "$@"`.
    - Uses `exec` to ensure clean process termination and signal handling.
    - Includes traceability comment: `# trace:TASK-7 | ai:...`.
