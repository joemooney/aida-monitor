  author: aida
  node_id: ''
  lamport: 7
  timestamp: 2026-09-19T18:56:49.914033276Z
  kind: !Create
    title: Visualize looping state machine swimlane and phase funnel
    description: |-
      ## Problem
      Traditional CI tools render pipelines as Directed Acyclic Graphs (DAGs). In AIDA, pipelines are looping state machines where shelved specs return to earlier phases (e.g. implementer after reviewer or ci failure). A 5-round spec appears as 1 neat row on a DAG, hiding that 80% of time was consumed in round trips.

      ## Proposed Solution
      1. Horizontal Swimlane Timeline:
         - One lane per active/recent spec with an x-axis representing wall-clock time.
         - Colored segments for each phase (implementer, ci, reviewer, integrator).
         - Distinct loopback glyphs/markers where a SpecShelved event returned the spec to a previous phase.
         - Deduplicate consecutive identical PhaseEntered emissions on (run_uuid, event, slug).
      2. Wave Phase Funnel:
         - Per active wave, display counts of specs entered, specs advanced, and specs shelved back.
         - Answers 'where does work die' at a single glance.

      ## Acceptance Criteria
      - [ ] Swimlane view rendered in Dioxus and plain-text modes.
      - [ ] Multi-round trips visually show horizontal width proportional to cumulative wall-clock time across all rounds.
      - [ ] Consecutive identical phase emissions are deduplicated before computing phase duration.
      - [ ] Funnel summary cards show entry/shelve ratios for active waves.
      - [ ] Self-check assertion verifies lane timestamps against .aida/events.jsonl.
    req_type: Story
    status: Draft
    priority: High
- id: 01a0bb07-5f6b-72e2-8c95-3f4a4ebfe7ed
  target_id: 01a0bb07-5d50-7b91-813d-04099e4200b7
  author: aida
  node_id: ''
  lamport: 8
  timestamp: 2026-09-19T18:56:57.707413804Z
  kind: !Create
    title: Identify active agent processes on held PRs at the gate
    description: |-
      ## Problem
      When a pull request is held at the gate (aida merge-hold list), an operator cannot immediately tell whether an autonomous reviewer process is actively reviewing it or has halted. Merging without this knowledge risks merging seconds before a reviewer's objection is posted.

      ## Proposed Solution
      Join aida merge-hold list --json with aida ps --json (and aida drain status --json) to correlate held PR branches/specs with active agent processes and display reviewer status, latest finding snippet, and advisor verdict.

      ## Acceptance Criteria
      - [ ] At The Gate panel matches held PR spec/branch with active session in aida ps.
      - [ ] Shows live indicator: Reviewer Active (PID <pid>, <elapsed>) vs Idle / Awaiting Human.
      - [ ] Displays the first line of the most recent reviewer finding from .aida/harvest/ or aida findings list.
      - [ ] Displays the most recent advisor verdict (.aida/review-verdicts/).
      - [ ] Self-check verifies PID and held count against raw CLI JSON.
    req_type: Story
    status: Draft
    priority: Medium
- id: 01a0bb07-73ad-7381-8e49-6a742fc5ee3f
  target_id: 01a0bb07-71d2-7e71-9002-02a59faa92be
  author: aida
  node_id: ''
  lamport: 9
  timestamp: 2026-09-19T18:57:02.893665144Z
  kind: !Create
    title: Persist feed byte cursor and generate since-you-were-away digest
    description: |-
      ## Problem
      1. When the monitor is stopped and restarted, re-reading the entire feed from the beginning risks re-announcing historical events as if they just happened.
      2. An operator returning to their desk needs a concise summary of what happened while away without having to read hundreds of raw event log lines.

      ## Proposed Solution
      1. Persist a local reader cursor (.aida-monitor/cursor.json or local data dir) recording last_byte_offset and last_seen_ts.
      2. On startup, initialize the feed tail from the end of the file or saved cursor.
      3. Provide a 'Since You Were Away' catch-up digest summarizing all terminal events (CiTerminal, PrMerged, SpecShelved, AdvisorEscalated) since the marked timestamp.

      ## Acceptance Criteria
      - [ ] Feed tailer starts at EOF or persisted byte cursor on cold startup; does not replay historical events.
      - [ ] Local cursor persists cleanly without modifying any target project files.
      - [ ] 'Since You Were Away' banner/drawer displays count of merges, red CIs, and shelves since the operator's last session.
      - [ ] Works in both Dioxus GUI and --plain terminal mode.
    req_type: Task
    status: Draft
    priority: Medium
- id: 01a0bb07-8942-7280-994a-6c22d9aaefd5
  target_id: 01a0bb07-877c-7190-ab70-e6060070da18
  author: aida
  node_id: ''
  lamport: 10
  timestamp: 2026-09-19T18:57:08.418630133Z
  kind: !Create
    title: Inspect per-spec and per-round token usage from session logs
    description: |-
      ## Problem
      AIDA core CLI commands do not expose token usage metrics, but headless drain logs under .aida/headless-logs/ and .aida/burndown/ contain JSONL message_delta events with token usage (input_tokens, cache_creation_input_tokens, cache_read_input_tokens, output_tokens).

      ## Proposed Solution
      A passive, non-blocking background scanner that attributes token consumption to specs and rounds based on log filenames (<spec>-<uuid>.jsonl). Clearly mark the panel as best-effort / derived from agent logs per the project brief.

      ## Acceptance Criteria
      - [ ] Reads .aida/headless-logs/ in a read-only, non-blocking background thread.
      - [ ] Aggregates input tokens, cache reads/writes, and output tokens per spec.
      - [ ] Visually labeled as 'Best-Effort (Agent Vendor Logs)' to indicate it is not guaranteed by core AIDA commands.
      - [ ] Degrades gracefully to empty/neutral state if .aida/headless-logs/ does not exist or format changes.
      - [ ] Never blocks UI rendering or CLI command execution.
    req_type: Story
    status: Draft
    priority: Low
