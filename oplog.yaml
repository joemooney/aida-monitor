  lamport: 22
  timestamp: 2026-09-19T20:23:12.254723410Z
  kind: !Create
    title: Support switching target AIDA projects via CLI and interactive UI dropdown
    description: |-
      ## Problem
      Currently, monitoring a different AIDA project requires stopping the app and relaunching with an explicit `--path /absolute/path`. There is no way to switch projects from within the desktop UI, and the CLI requires full paths rather than project slugs.

      ## Proposed Solution
      1. **Registry Discovery**: Read `~/.aida/projects.toml` (the global registry written when projects are initialized with `aida init`), filtering for valid existing projects.
      2. **CLI Convenience**: Support project names/slugs directly in `run.sh` and `aida-monitor` (e.g. `./run.sh aida` or `--project aida`), resolving against `~/.aida/projects.toml` with fallback to direct filesystem path.
      3. **UI Project Switcher**: Add an interactive project selector dropdown in the top header ribbon, populated with registered projects from `projects.toml`.
      4. **Hot-Switching**: When a user selects a different project from the dropdown, the collector resets its feed reader, gathers a full snapshot of the new project, and smoothly updates all panels without restarting the app.

      ## Acceptance Criteria
      - [ ] `~/.aida/projects.toml` is parsed gracefully, ignoring non-existent or temporary paths.
      - [ ] CLI accepts either a directory path or a registered project name (e.g. `./run.sh aida`).
      - [ ] Header includes an interactive project switcher dropdown showing available projects.
      - [ ] Selecting a project dynamically switches all panels and the live event feed to the selected project.
      - [ ] Maintains Prime Directive 1 (zero writes to any target project) and Directive 4 (degrade gracefully if `projects.toml` is missing or malformed).
    req_type: Story
    status: Approved
    priority: Medium
- id: 01a0bb57-a02e-7a40-9c31-b1ea8e055815
  target_id: 01a0bb57-9c96-7133-ab0b-f35924f7bafb
  author: aida
  node_id: ''
  lamport: 23
  timestamp: 2026-09-19T20:24:37.166726822Z
  kind: !Create
    title: Support UI zooming via keyboard shortcuts and Ctrl-mousewheel
    description: |-
      ## Problem
      Operators using large wall displays, 4K monitors, or laptop screens need the ability to scale the dashboard UI density dynamically without changing OS-level display scaling.

      ## Proposed Solution
      Add interactive UI zoom controls supporting standard keyboard and mouse gestures:
      1. Keyboard Shortcuts:
         - Ctrl + + / Ctrl + = (or Cmd on macOS): Zoom in (increment by 10%).
         - Ctrl + -: Zoom out (decrement by 10%).
         - Ctrl + 0: Reset zoom to 100% (1.0).
      2. Mouse Wheel:
         - Ctrl + Wheel Up: Zoom in.
         - Ctrl + Wheel Down: Zoom out.
      3. Clamping and Indicator:
         - Clamp zoom range between 50% (0.5) and 200% (2.0).
         - Display current zoom percentage pill in header or status ribbon when non-100%, with click-to-reset.
         - Persist zoom level across tab navigation.

      ## Acceptance Criteria
      - [ ] Pressing Ctrl/Cmd + Plus/Minus/Zero adjusts zoom level smoothly.
      - [ ] Holding Ctrl and scrolling the mouse wheel zooms in/out.
      - [ ] Zoom is bounded between 50% and 200%.
      - [ ] Visual indicator shows current zoom percentage and allows 1-click reset to 100%.
      - [ ] All panels, metrics ribbons, and drawer components scale cleanly without layout breakage.
    req_type: Story
    status: Draft
    priority: Medium
