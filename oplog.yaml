  kind: !Create
    title: Identify active agent processes on held PRs at the gate
    description: |-
      ## Problem
      When a pull request is held at the gate (aida merge-hold list), an operator cannot immediately tell whether an autonomous reviewer process is actively reviewing it or has halted. Merging without this knowledge risks merging seconds before a reviewer's objection is posted.

      ## Proposed Solution
      Join aida merge-hold list --json with aida ps --json (and aida drain status --json) to correlate held PR branches/specs with active agent processes and display reviewer status, latest finding snippet, and advisor verdict.

      ## Acceptance Criteria
      - [ ] At The Gate panel matches held PR spec/branch with active session in aida ps.
      - [ ] Shows live indicator: Reviewer Active (PID <pid>, <elapsed>) vs Idle / Awaiting Human.
      - [ ] Displays the first line of the most recent reviewer finding from .aida/harvest/ or aida findings list.
      - [ ] Displays the most recent advisor verdict (.aida/review-verdicts/).
      - [ ] Self-check verifies PID and held count against raw CLI JSON.
    req_type: Story
    status: Draft
    priority: Medium
- id: 01a0bb07-73ad-7381-8e49-6a742fc5ee3f
  target_id: 01a0bb07-71d2-7e71-9002-02a59faa92be
  author: aida
  node_id: ''
  lamport: 9
  timestamp: 2026-09-19T18:57:02.893665144Z
  kind: !Create
    title: Persist feed byte cursor and generate since-you-were-away digest
    description: |-
      ## Problem
      1. When the monitor is stopped and restarted, re-reading the entire feed from the beginning risks re-announcing historical events as if they just happened.
      2. An operator returning to their desk needs a concise summary of what happened while away without having to read hundreds of raw event log lines.

      ## Proposed Solution
      1. Persist a local reader cursor (.aida-monitor/cursor.json or local data dir) recording last_byte_offset and last_seen_ts.
      2. On startup, initialize the feed tail from the end of the file or saved cursor.
      3. Provide a 'Since You Were Away' catch-up digest summarizing all terminal events (CiTerminal, PrMerged, SpecShelved, AdvisorEscalated) since the marked timestamp.

      ## Acceptance Criteria
      - [ ] Feed tailer starts at EOF or persisted byte cursor on cold startup; does not replay historical events.
      - [ ] Local cursor persists cleanly without modifying any target project files.
      - [ ] 'Since You Were Away' banner/drawer displays count of merges, red CIs, and shelves since the operator's last session.
      - [ ] Works in both Dioxus GUI and --plain terminal mode.
    req_type: Task
    status: Draft
    priority: Medium
